name: Build SDK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SecRandom.Integration.slnx -c Release --nologo
      - run: python -m unittest discover -s bindings/python/tests -v
      - run: cargo test --manifest-path bindings/rust/secrandom-integration/Cargo.toml
      - name: Compile C++ adapter on Unix
        if: runner.os != 'Windows'
        run: c++ -std=c++17 -Wall -Wextra -Werror -I bindings/cpp/include bindings/cpp/tests/compile.cpp -o "$RUNNER_TEMP/sdk-cpp-smoke"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile C++ adapter on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /std:c++17 /EHsc /W4 /WX /I bindings\cpp\include bindings\cpp\tests\compile.cpp /Fe:%RUNNER_TEMP%\sdk-cpp-smoke.exe

  build:
    needs: cross-platform
    runs-on: ubuntu-latest
    env:
      SECRANDOM_INTEGRATION_PUBLIC_KEY_SPKI_BASE64: ${{ vars.SECRANDOM_INTEGRATION_PUBLIC_KEY_SPKI_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SecRandom.Integration.slnx -c Release --nologo
      - name: Test Python adapter
        run: python3 -m unittest discover -s bindings/python/tests -v
      - name: Test Rust adapter
        run: cargo test --manifest-path bindings/rust/secrandom-integration/Cargo.toml
      - name: Compile C++ adapter
        run: g++ -std=c++17 -Wall -Wextra -Werror -I bindings/cpp/include bindings/cpp/tests/compile.cpp -o /tmp/secrandom-integration-cpp-smoke
      - name: Sign the official SDK assembly
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          SECRANDOM_INTEGRATION_SIGNING_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.SECRANDOM_INTEGRATION_SIGNING_PRIVATE_KEY_PKCS8_BASE64 }}
        run: |
          mkdir -p artifacts
          dotnet build tools/SecRandom.Integration.Signing/SecRandom.Integration.Signing.csproj -c Release --no-restore
          dotnet run --project tools/SecRandom.Integration.Signing/SecRandom.Integration.Signing.csproj -c Release --no-build -- \
            src/SecRandom.Integration.Client/bin/Release/net8.0/SecRandom.Integration.Client.dll \
            artifacts/SecRandom.Integration.Client.official-proof.json
      - name: Pack SDK packages
        run: |
          version=$(dotnet msbuild src/SecRandom.Integration.Client/SecRandom.Integration.Client.csproj -getProperty:Version)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          mkdir -p artifacts/packages
          dotnet pack src/SecRandom.Integration.Abstractions/SecRandom.Integration.Abstractions.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SecRandom.DrawKit/SecRandom.DrawKit.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SecRandom.Integration.Client/SecRandom.Integration.Client.csproj -c Release --no-build -o artifacts/packages -p:OfficialProofPath="$GITHUB_WORKSPACE/artifacts/SecRandom.Integration.Client.official-proof.json"
      - name: Assemble release package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mkdir -p artifacts/release-package
          cp artifacts/packages/*.nupkg artifacts/SecRandom.Integration.Client.official-proof.json artifacts/release-package/
          rsync -a --exclude target --exclude __pycache__ --exclude '*.pyc' bindings artifacts/release-package/
          cp docs/automation-v2.md artifacts/release-package/
          (cd artifacts/release-package && zip -r ../SecRandom-Integration-SDK.zip .)
      - name: Verify release package as a consumer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          unzip -q artifacts/SecRandom-Integration-SDK.zip -d "$RUNNER_TEMP/sdk-release"
          if find "$RUNNER_TEMP/sdk-release/bindings" \( -name target -o -name __pycache__ -o -name '*.pyc' \) | grep -q .; then
            echo "Release contains build caches" >&2
            exit 1
          fi
          dotnet restore samples/PackageSmoke/PackageSmoke.csproj -p:RestoreAdditionalProjectSources="$RUNNER_TEMP/sdk-release" --packages "$RUNNER_TEMP/sdk-packages"
          dotnet run --project samples/PackageSmoke/PackageSmoke.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: SecRandom-Integration-SDK
          path: artifacts/SecRandom-Integration-SDK.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SecRandom-Integration-SDK
          path: artifacts
      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "NUGET_API_KEY is not configured" >&2; exit 1; }
          unzip -q artifacts/SecRandom-Integration-SDK.zip -d "$RUNNER_TEMP/sdk-release"
          version="${GITHUB_REF_NAME#v}"
          for package in SecRandom.Integration.Abstractions SecRandom.Integration.Client SecRandom.DrawKit; do
            dotnet nuget push "$RUNNER_TEMP/sdk-release/$package.$version.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done
      - uses: softprops/action-gh-release@v2
        with:
          name: SecRandom 集成 SDK ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: artifacts/SecRandom-Integration-SDK.zip


